<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扬州市邗江区"四位一体"市场化服务项目 投标评审系统</title>
<script src="../chart.min.js"></script>
<script src="../chart-labels.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0d9488;--primary-light:#e6fffb;--primary-dark:#0f766e;
  --accent:#4f6ef7;--accent-light:#eef1fe;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --bg:#f0f2f5;--card:#fff;--text:#1f2937;--text-secondary:#6b7280;
  --border:#e5e7eb;--sidebar-w:248px;--header-h:60px;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);line-height:1.65}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}

/* ===== ENTRY ===== */
.entry-page{display:flex;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d9488 0%,#0891b2 55%,#4f6ef7 100%);padding:24px;flex-direction:column}
.entry-head{text-align:center;color:#fff;margin-bottom:28px}
.entry-head .eh-logo{font-size:2.8rem;margin-bottom:8px}
.entry-head h1{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.entry-head p{color:rgba(255,255,255,.85);font-size:.92rem}
.entry-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,320px));gap:22px;width:100%;max-width:1080px}
.project-choice{background:#fff;border-radius:16px;padding:26px 22px;cursor:pointer;box-shadow:var(--shadow-lg);transition:transform .2s,border-color .2s;border:3px solid transparent;text-align:center}
.project-choice:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.7)}
.pc-icon{width:58px;height:58px;border-radius:14px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff}
.pc-icon.a{background:linear-gradient(135deg,#0d9488,#0f766e)}
.pc-icon.b{background:linear-gradient(135deg,#4f6ef7,#3a56d4)}
.pc-icon.c{background:linear-gradient(135deg,#f59e0b,#d97706)}
.project-choice h3{font-size:1.1rem;margin-bottom:6px;color:var(--text)}
.project-choice .pc-sub{color:var(--text-secondary);font-size:.82rem;line-height:1.6;margin-bottom:12px;min-height:36px}
.pc-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;margin:0 3px 8px}
.pc-tag.new{background:#e0f2fe;color:#0369a1}
.pc-tag.bid{background:#dbeafe;color:#2563eb}
.pc-tag.deal{background:#dcfce7;color:#15803d}
.pc-metrics{display:flex;justify-content:space-between;margin-top:8px;padding-top:12px;border-top:1px dashed var(--border)}
.pc-metrics .m{text-align:center;flex:1}
.pc-metrics .m .v{font-size:1rem;font-weight:700;color:var(--text)}
.pc-metrics .m .v.warn{color:var(--warning)}
.pc-metrics .m .v.good{color:var(--success)}
.pc-metrics .m .v.bad{color:var(--danger)}
.pc-metrics .m .l{font-size:.68rem;color:var(--text-secondary)}
.pc-btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.94rem;font-weight:600;margin-top:14px}
.pc-btn.b{background:#4f6ef7}.pc-btn.c{background:#d97706}
.entry-foot{color:rgba(255,255,255,.78);font-size:.78rem;margin-top:24px;text-align:center;line-height:1.8}
@media(max-width:900px){.entry-grid{grid-template-columns:1fr;max-width:400px}}

/* ===== LAYOUT ===== */
.app-layout{display:none;min-height:100vh}
.app-layout.active{display:flex}
.sidebar{width:var(--sidebar-w);background:#1e293b;color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;display:flex;flex-direction:column}
.sidebar-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sidebar-header .logo-icon{font-size:1.55rem}
.sidebar-header h2{font-size:.98rem;font-weight:600;white-space:nowrap;line-height:1.4}
.sidebar-nav{flex:1;padding:10px 0 16px;overflow-y:auto}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;font-size:.92rem;border-left:3px solid transparent;user-select:none}
.sidebar-nav .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-nav .nav-item.active{background:rgba(13,148,136,.25);color:#fff;border-left-color:var(--primary)}
.sidebar-nav .nav-item .nav-icon{font-size:1.1rem;width:22px;text-align:center;flex:none}
.sidebar-nav .nav-section{padding:10px 20px 4px;font-size:.7rem;text-transform:uppercase;color:rgba(255,255,255,.35);letter-spacing:.8px}
.sidebar-nav .nav-group{margin:1px 0}
.sidebar-nav .nav-group-header{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;font-size:.92rem;border-left:3px solid transparent;user-select:none}
.sidebar-nav .nav-group-header:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-nav .nav-group-header .nav-icon{font-size:1.1rem;width:22px;text-align:center;flex:none}
.sidebar-nav .nav-group-header .chev{margin-left:auto;font-size:.7rem;transition:transform .25s;opacity:.7}
.sidebar-nav .nav-group.open .nav-group-header{color:#fff}
.sidebar-nav .nav-group.open .nav-group-header .chev{transform:rotate(90deg)}
.sidebar-nav .nav-group.has-active .nav-group-header{color:#fff;border-left-color:var(--primary);background:rgba(13,148,136,.14)}
.sidebar-nav .nav-sub{max-height:0;overflow:hidden;transition:max-height .28s ease}
.sidebar-nav .nav-group.open .nav-sub{max-height:520px}
.sidebar-nav .nav-sub .nav-item{padding-left:54px;font-size:.86rem;padding-top:9px;padding-bottom:9px}
.sidebar-nav .nav-sub .nav-item .nav-icon{font-size:.95rem}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-footer .cur-proj{font-size:.76rem;color:rgba(255,255,255,.55);text-align:center;margin-bottom:9px}
.sidebar-footer .switch-proj{width:100%;padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:rgba(255,255,255,.8);font-size:.84rem;display:flex;align-items:center;justify-content:center;gap:6px}
.sidebar-footer .switch-proj:hover{background:rgba(255,255,255,.08)}
/* 直达项目界面：取消包选择入口与切换项目栏 */
#entryPage{display:none!important}
.sidebar-footer .switch-proj{display:none!important}
.sidebar-footer .cur-proj{margin-bottom:0}
.main-content{margin-left:var(--sidebar-w);flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:50}
.topbar .menu-toggle{display:none;background:none;border:none;font-size:1.4rem;color:var(--text)}
.topbar .page-title{font-size:1.1rem;font-weight:700}
.topbar .topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.topbar .proj-pill{font-size:.78rem;padding:5px 12px;border-radius:20px;background:var(--primary-light);color:var(--primary-dark);font-weight:600;white-space:nowrap}
.topbar .status-pill{font-size:.76rem;font-weight:700;padding:5px 13px;border-radius:16px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;white-space:nowrap}
.topbar .status-pill.deal{background:#fef3c7;color:#b45309;border-color:#fde68a}
.page-content{flex:1;padding:22px 24px 40px;max-width:1560px;width:100%;margin:0 auto}
.page{display:none;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-lead{font-size:.84rem;color:var(--text-secondary);line-height:1.8;margin:-4px 0 16px}

/* ===== KPI / CARDS ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.kpi-grid.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi-grid.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1200px){.kpi-grid.k5{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi-grid.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.kpi-grid.k4,.kpi-grid.k5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px 19px;box-shadow:0 4px 14px rgba(15,23,42,.05);min-width:0}
.kpi .label{font-size:.78rem;color:var(--text-secondary);line-height:1.5}
.kpi .value{font-size:1.46rem;font-weight:800;margin-top:5px;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:.82rem;color:var(--text-secondary);font-weight:600;margin-left:3px}
.kpi .note{font-size:.72rem;margin-top:4px;color:var(--text-secondary);line-height:1.6}
.kpi.warn .value{color:var(--warning)}
.kpi.danger .value{color:var(--danger)}
.kpi.ok .value{color:var(--ok,#16a34a)}
.kpi.accent{border-color:#dbe2ff;background:linear-gradient(180deg,#fbfcff,#fff)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.05);margin-bottom:20px;overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-header h3{font-size:.98rem;font-weight:700}
.card-header .badge{font-size:.7rem;padding:3px 9px;border-radius:12px;background:var(--primary-light);color:var(--primary-dark);border:1px solid #ccfbf1;margin-left:auto;font-weight:700}
.card-header .sub{font-size:.76rem;color:var(--text-secondary);font-weight:400}
.card-body{padding:20px}
.card-body.no-padding{padding:0}
.card-body.tight{padding:14px 16px}
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.05);min-width:0}
.chart-box h4{font-size:.9rem;margin-bottom:13px;color:var(--text)}
.chart-box .cv{position:relative;height:250px}
.cv{position:relative}
.cv.mid{height:290px}
.cv.tall{height:320px}
.cv.xl{height:400px}

/* ===== TABLES ===== */
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--text-secondary);font-weight:600;font-size:.79rem;white-space:nowrap}
td.l,th.l{text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tbody tr:hover{background:#fbfdff}
tr.subtotal{background:#f1f5f9;font-weight:700}
tr.total{background:#eef1fe;font-weight:800}
tr.highlight{background:var(--primary-light)}
tr.highlight:hover{background:#d9fffa}
.tag-diff{display:inline-block;min-width:34px;padding:2px 8px;border-radius:10px;font-size:.76rem;font-weight:700}
.tag-diff.neg{background:#fee2e2;color:#b91c1c}
.tag-diff.pos{background:#dcfce7;color:#15803d}
.tag-diff.zero{background:#f1f5f9;color:#94a3b8}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.74rem;font-weight:700;white-space:nowrap}
.tag.ok,.tag-success{background:#dcfce7;color:#15803d}
.tag.warn,.tag-warning{background:#fef3c7;color:#b45309}
.tag.bad,.tag-danger{background:#fee2e2;color:#b91c1c}
.tag.info,.tag-info{background:#dbeafe;color:#1d4ed8}
.tag.gray{background:#f1f5f9;color:#64748b}
.tag.purple{background:#ede9fe;color:#6d28d9}
.neg{color:#b91c1c}.pos{color:#15803d}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-scroll table{min-width:720px}
.tbl-scroll.narrow table{min-width:520px}
.tbl-scroll table th:first-child,.tbl-scroll table td:first-child{white-space:nowrap}
.table-note{font-size:.75rem;color:var(--text-secondary);line-height:1.7;padding:10px 20px 14px}

/* ===== INFO LIST ===== */
.info-list{display:flex;flex-direction:column;gap:0}
.info-item{padding:13px 0;border-bottom:1px dashed var(--border);display:grid;grid-template-columns:132px 1fr;gap:16px}
.info-item:last-child{border-bottom:none}
.info-item .k{font-weight:700;color:var(--primary-dark);font-size:.88rem}
.info-item .v{color:var(--text);line-height:1.8;font-size:.87rem}
.info-item .v p{margin:4px 0}

/* ===== TABS ===== */
.tabs{display:flex;flex-wrap:wrap;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:18px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.tab{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:.87rem;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{background:#f1f5f9;color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.28)}
.tab-count{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:#f1f5f9;color:var(--text-secondary)}
.tab.active .tab-count{background:rgba(255,255,255,.22);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}
.subtabs{display:flex;width:fit-content;align-items:center;gap:6px;margin:0 0 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.subtab{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:.84rem;font-weight:600;padding:8px 16px;border-radius:7px;cursor:pointer;transition:all .2s;white-space:nowrap}
.subtab:hover{background:#f1f5f9;color:var(--text)}
.subtab.active{background:var(--primary-light);color:var(--primary-dark);box-shadow:inset 0 0 0 1px #99f6e4}
.veh-subpanel{display:none}
.veh-subpanel.active{display:block}
@media(max-width:760px){.tabs{gap:5px;padding:5px}.tab{flex:1 0 auto;justify-content:center;padding:8px 10px;font-size:.8rem}.subtabs{width:100%;justify-content:space-between}.subtab{flex:1;text-align:center;padding:8px 4px}}

/* ===== RISK ===== */
.risk-item{border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:15px 18px;margin-bottom:13px;background:#fff}
.risk-item.high{border-left-color:var(--danger)}
.risk-item.mid{border-left-color:var(--warning)}
.risk-item.low{border-left-color:#94a3b8}
.risk-head{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.risk-level{font-size:.7rem;font-weight:800;padding:3px 10px;border-radius:10px}
.risk-level.high{background:#fee2e2;color:#b91c1c}
.risk-level.mid{background:#fef3c7;color:#b45309}
.risk-level.low{background:#f1f5f9;color:#64748b}
.risk-title{font-weight:700;font-size:.94rem}
.risk-source{margin-left:auto;font-size:.68rem;color:#94a3b8;font-weight:600;white-space:nowrap}
.risk-desc{font-size:.85rem;color:var(--text-secondary);line-height:1.8}
.risk-desc b{color:var(--text)}
.empty-state{padding:38px 20px;text-align:center;border:1px dashed var(--border);border-radius:14px;background:#fff;color:var(--text-secondary)}
.empty-state .es-title{font-weight:700;color:var(--text);font-size:.95rem;margin-bottom:6px}
.empty-state .es-sub{font-size:.84rem;line-height:1.7}

/* ===== CONCLUSION ===== */
.concl-box{background:linear-gradient(135deg,#e6fffb,#f0fdfa 55%,#eef1fe);border:1px solid #99f6e4;border-radius:16px;padding:22px;margin-bottom:20px;position:relative;overflow:hidden}
.concl-box::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(13,148,136,.08)}
.concl-box .big{font-size:1.16rem;font-weight:800;color:var(--primary-dark);line-height:1.7;position:relative;z-index:1}
.concl-box .sub{font-size:.86rem;color:var(--text-secondary);line-height:1.8;margin-top:7px;position:relative;z-index:1}
.concl-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;position:relative;z-index:1}
.steps{counter-reset:s;margin-top:4px}
.step{position:relative;padding:12px 14px 12px 48px;border-bottom:1px dashed var(--border);font-size:.87rem;line-height:1.8;color:var(--text-secondary)}
.step:last-child{border-bottom:none}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.step b{color:var(--text)}
.step .owner{display:inline-block;font-size:.7rem;font-weight:700;color:var(--primary-dark);background:var(--primary-light);padding:1px 8px;border-radius:8px;margin-left:6px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e2e8f0}
.tl-item{position:relative;padding:0 0 20px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px #99f6e4}
.tl-item .tl-date{font-size:.75rem;font-weight:800;color:var(--primary-dark)}
.tl-item .tl-title{font-size:.88rem;font-weight:700;margin-top:2px}
.tl-item .tl-desc{font-size:.78rem;color:var(--text-secondary);line-height:1.7;margin-top:2px}

/* ===== DOC ===== */
.doc-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.doc-toolbar .dt-name{font-weight:700;font-size:.94rem}
.doc-toolbar .dt-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.doc-btn{border:1px solid var(--border);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 14px;font-size:.84rem;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.doc-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.doc-dl{font-size:.8rem;color:#fff;background:var(--primary);border:1px solid var(--primary);padding:7px 14px;border-radius:8px;font-weight:600;text-decoration:none;display:inline-block}
.doc-dl:hover{background:var(--primary-dark)}
.doc-meta{font-size:.8rem;color:var(--text-secondary);margin-bottom:14px;line-height:1.7}
.doc-section{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.doc-section h3{font-size:.98rem;color:var(--primary-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.doc-section h4{font-size:.9rem;margin:14px 0 8px;color:var(--text)}
.doc-section table{min-width:640px}
.doc-section p{font-size:.86rem;line-height:1.9;color:var(--text-secondary);margin:8px 0}
.doc-section ul{margin:6px 0 6px 20px;font-size:.86rem;line-height:1.9;color:var(--text-secondary)}
.doc-note{background:#f8fafc;border-left:3px solid var(--primary);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.82rem;line-height:1.75;color:var(--text-secondary);margin:10px 0}
.doc-note.warn{background:#fffbeb;border-left-color:var(--warning)}
.doc-note.info{background:#eff6ff;border-left-color:#3b82f6}
.reply-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.reply{border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.82rem;line-height:1.8;color:var(--text-secondary);background:#fff}
.reply b{display:block;color:var(--text);margin-bottom:4px;font-size:.8rem}
.reply.invest{border-left:3px solid #3b82f6;background:#f8fbff}
.reply.op{border-left:3px solid #f59e0b;background:#fffdf5}
@media(max-width:900px){.reply-grid{grid-template-columns:1fr}}
.doc-dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dl-card{border:1px solid var(--border);border-radius:12px;padding:14px 15px;background:#fff;display:flex;flex-direction:column;gap:7px}
.dl-card .dl-title{font-size:.88rem;font-weight:700;line-height:1.5}

/* ===== 通用工具（函数声明，供 02-data 加载期调用） ===== */
function fmt(v,d=2){
  if(v==null||Number.isNaN(Number(v))) return '—';
  return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtPct(v,d=2){
  if(v==null||Number.isNaN(Number(v))) return '—';
  return (Number(v)*100).toFixed(d)+'%';
}
function signed(v,d=2){
  if(v==null||Number.isNaN(Number(v))) return '—';
  const s=Number(v).toFixed(d);
  return Number(v)>0?'+'+s:s;
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function irrText(v){
  if(v==null) return '不适用';
  return fmtPct(v);
}
function marginTag(v){
  if(v==null) return '<span class="tag gray">—</span>';
  if(v>=0.08) return '<span class="tag ok">≥ 8%</span>';
  if(v>=0.06) return '<span class="tag warn">6%–8%</span>';
  return '<span class="tag bad">&lt; 6%</span>';
}
function gapTag(n){
  if(n===0) return '<span class="tag-diff zero">0</span>';
  if(n>0) return '<span class="tag-diff neg">缺 '+n+'</span>';
  return '<span class="tag-diff pos">超 '+(-n)+'</span>';
}
function levelName(l){ return l==='high'?'高':l==='medium'?'中':'低'; }
function levelClass(l){ return l==='high'?'high':l==='medium'?'mid':'low'; }
function planTag(s){
  return s==='bid'?'<span class="plan-tag p1">招标版</span>':'<span class="plan-tag p2">实操版</span>';
}

function navigateTo(page){
  const pg=document.getElementById('page-'+page);
  if(!pg) return;
  document.querySelectorAll('.page').forEach(function(x){ x.classList.remove('active'); });
  pg.classList.add('active');
  document.getElementById('pageTitle').textContent=PAGE_TITLES[page]||'';
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(x){ x.classList.remove('active'); });
  let navItem=document.querySelector('.sidebar-nav .nav-item[data-page="'+page+'"]');
  if(!navItem){
    if(['background','settings','invest','ops'].indexOf(page)>=0) navItem=document.getElementById('navReview');
    else if(['doc1','doc2','doc3','doc4','doc5'].indexOf(page)>=0) navItem=document.getElementById('navDoc');
  }
  if(navItem) navItem.classList.add('active');
  const sb=document.getElementById('sidebar');
  if(sb) sb.classList.remove('open');
  const ov=document.getElementById('sidebarOverlay');
  if(ov) ov.classList.remove('open');
  if(typeof initPageCharts==='function') initPageCharts(page);
  window.scrollTo(0,0);
}

function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebarOverlay');
  if(!sb) return;
  const open=sb.classList.toggle('open');
  if(ov) ov.classList.toggle('open',open);
}

function renderFinance(){
  if(typeof destroyFinCharts==='function') destroyFinCharts();
  const p=P();
  document.getElementById('finContent').innerHTML=
    '<div class="page-lead">'+p.full+' 财务测算：年服务费 '+p.服务费+'，服务期 3 年。方案一（招标版）按招标最低配置测算，方案二（实操版）按实际运营配置测算；财务页签覆盖收益、成本、现金流、初期投资与评审前后调整。</div>'
    +finTabsHTML()
    +'<div class="tab-panel'+(FIN_TAB==='years'?' active':'')+'" id="finPanel-years">'+finYearsHTML(p)+'</div>'
    +'<div class="tab-panel'+(FIN_TAB==='cost'?' active':'')+'" id="finPanel-cost">'+finCostHTML(p)+'</div>'
    +'<div class="tab-panel'+(FIN_TAB==='cash'?' active':'')+'" id="finPanel-cash">'+finCashHTML(p)+'</div>'
    +'<div class="tab-panel'+(FIN_TAB==='invest'?' active':'')+'" id="finPanel-invest">'+finInvestHTML(p)+'</div>'
    +'<div class="tab-panel'+(FIN_TAB==='adjust'?' active':'')+'" id="finPanel-adjust">'+finAdjustHTML(p)+'</div>';
  const pg=document.getElementById('page-finance');
  if(pg&&pg.classList.contains('active')&&typeof initFinCharts==='function') initFinCharts(p);
}

function switchFinTab(key){
  FIN_TAB=key;
  document.querySelectorAll('#finContent .tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab')===key);
  });
  document.querySelectorAll('#finContent .tab-panel').forEach(function(x){
    x.classList.toggle('active', x.id==='finPanel-'+key);
  });
  if(typeof destroyFinCharts==='function') destroyFinCharts();
  if(typeof initFinCharts==='function') initFinCharts(P());
}

function switchFinScheme(scheme){
  FIN_SCHEME=scheme;
  renderFinance();
}

function switchRiskTab(lv,btn){
  document.querySelectorAll('#riskTabs .tab').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  let shown=0;
  document.querySelectorAll('#riskList .risk-item').forEach(function(it){
    const show=(lv==='all'||it.dataset.lv===lv);
    it.style.display=show?'':'none';
    if(show) shown++;
  });
  const empty=document.getElementById('riskEmpty');
  if(empty) empty.style.display=shown?'none':'';
}

/* ===== 图表 ===== */
const CH={};

function mkChart(id,cfg){
  const el=document.getElementById(id);
  if(!el) return null;
  if(CH[id]){ try{CH[id].destroy();}catch(e){} delete CH[id]; }
  try{ CH[id]=new Chart(el,cfg); el._done=true; }catch(e){ console.warn('chart init failed:',id,e); }
  return CH[id];
}

function destroyChart(id){
  if(CH[id]){ try{CH[id].destroy();}catch(e){} delete CH[id]; }
}

function destroyFinCharts(){
  ['chYears','chCost','chCash','chInvest','chAdjust','chStress'].forEach(destroyChart);
}

function destroyDashCharts(){
  ['chDashProfit','chDashInvest'].forEach(destroyChart);
}

function destroyStaffCharts(){
  ['chStaffStruct','chVehGap'].forEach(destroyChart);
}

function destroyAllCharts(){
  Object.keys(CH).forEach(function(k){ try{CH[k].destroy();}catch(e){} delete CH[k]; });
}

function initPageCharts(page){
  if(page==='dashboard') initDashCharts(P());
  else if(page==='finance') initFinCharts(P());
  else if(page==='staff') initStaffCharts(P());
}

const C_TEAL='#0d9488', C_TEAL_L='rgba(13,148,136,.72)', C_BLUE='#4f6ef7', C_BLUE_L='rgba(79,110,247,.72)';
const C_AMBER='#f59e0b', C_RED='#ef4444', C_GREEN='#22c55e', C_GRAY='#94a3b8';
const PCT_TICKS={callback:function(v){return v+'%';}};

function baseOpts(unitY,unitY1){
  const scales={
    x:{grid:{display:false},ticks:{font:{size:10.5}}},
    y:{beginAtZero:true,grid:{color:'#eef2f7'},ticks:{font:{size:10},callback:unitY==='%'?function(v){return v+'%';}:undefined},title:{display:!!unitY,text:unitY||'',font:{size:10}}}
  };
  if(unitY1){
    scales.y1={position:'right',beginAtZero:true,grid:{display:false},ticks:{font:{size:10},callback:function(v){return v+'%';}},title:{display:true,text:unitY1,font:{size:10}}};
  }
  return {
    responsive:true,maintainAspectRatio:false,
    layout:{padding:{top:6,right:36,bottom:0,left:0}},
    plugins:{legend:{position:'bottom',labels:{boxWidth:11,font:{size:10.5},padding:12}}},
    scales:scales
  };
}

/* ===== 初始化 ===== */
function toast(msg,type){
  const box=document.getElementById('toastContainer');
  if(!box) return;
  const el=document.createElement('div');
  el.className='toast '+(type==='error'?'toast-error':type==='info'?'toast-info':'toast-success');
  el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; setTimeout(function(){ el.remove(); },300); },2200);
}
