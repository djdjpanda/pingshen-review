@media print{

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function money(n){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(n){return Number(n).toFixed(2)+'%';}
function diffTag(v,invert){
  const n=Number(v);
  const cls=invert?(n>0?'neg':(n<0?'pos':'zero')):(n>0?'pos':(n<0?'neg':'zero'));
  const s=n>0?'+'+n:''+n;
  return '<span class="tag-diff '+cls+'">'+s+'</span>';
}
function rateTag(v,good,low){return '<span class="tag '+(v>=good?'ok':(v>=low?'warn':'bad'))+'">'+pct(v)+'</span>';}
function infoCard(title,items,badge){
  return '<div class="card"><div class="card-header"><h3>'+title+'</h3>'+(badge?'<span class="badge">'+badge+'</span>':'')+'</div><div class="card-body"><div class="info-list">'
    +items.map(it=>'<div class="info-item"><div class="k">'+it[0]+'</div><div class="v">'+it[1]+'</div></div>').join('')
    +'</div></div></div>';
}

const GRID={color:'#eef2f7'};
function chart(id,cfg){const el=$(id);if(!el||el._done)return;el._done=true;new Chart(el,cfg);}
function dashCharts(){

    {label:'净利润率',data:MARGIN.map(x=>x[1]),backgroundColor:MARGIN.map(x=>x[1]>=8?'#22c55e':x[1]>=6?'#f59e0b':'#ef4444'),borderRadius:6},
    {type:'line',label:'集团一般 8%',data:MARGIN.map(()=>8),borderColor:'#16a34a',borderDash:[6,4],pointRadius:0,borderWidth:2},
    {type:'line',label:'低效最低 6%',data:MARGIN.map(()=>6),borderColor:'#f59e0b',borderDash:[6,4],pointRadius:0,borderWidth:2}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}},scales:{y:{title:{display:true,text:'%'},grid:GRID},x:{grid:{display:false},ticks:{autoSkip:false,font:{size:10}}}}}});
  chart('chRevenue',{type:'bar',data:{labels:REV_BARS.map(x=>x[0]),datasets:[{label:'万元/年',data:REV_BARS.map(x=>x[1]),backgroundColor:['#94a3b8','#64748b','#3b82f6','#1d4ed8'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:GRID,title:{display:true,text:'万元'}},x:{grid:{display:false}}}}});
  chart('chInvest',{type:'doughnut',data:{labels:['设备投资','流动资金','前期费用'],datasets:[{data:[FIN.equip,FIN.working,FIN.prep],backgroundColor:['#1d4ed8','#3b82f6','#93c5fd'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12}}}}});
}

    chart('chCostItems',{type:'bar',data:{labels:COST_ITEMS.map(r=>r[0]),datasets:[{label:'万元/年',data:COST_ITEMS.map(r=>r[1]),backgroundColor:COST_ITEMS.map((r,i)=>i<3?'#1d4ed8':'#60a5fa'),borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:GRID,title:{display:true,text:'万元'}},y:{grid:{display:false},ticks:{font:{size:10}}}}}});
  } else if($('finPanel-cash').classList.contains('active')){
    chart('chCash',{data:{labels:['第0期','第一年','第二年','第三年'],datasets:[
      {type:'bar',label:'所得税后净现金流',data:[-673.59,191.44,220.20,344.98],backgroundColor:['#dc2626','#0891b2','#0891b2','#0891b2'],borderRadius:6,yAxisID:'y'},

  }
