<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湖州仁皇片区城市大管家项目 · 投资评审系统</title>
<script src="../chart.min.js"></script>
<script src="../chart-labels.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0891b2;--primary-dark:#0e7490;--accent:#4f6ef7;--bg:#f1f5f9;--card:#fff;
  --text:#1e293b;--text-secondary:#64748b;--border:#e5e7eb;--danger:#dc2626;--warn:#d97706;--ok:#059669;
  --sidebar-w:240px;--header-h:60px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app-layout{display:none;min-height:100vh}
.app-layout.active{display:flex}
/* ===== Sidebar ===== */
.sidebar{width:var(--sidebar-w);background:#12303a;color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;display:flex;flex-direction:column}
.sidebar-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sidebar-header .logo-icon{font-size:1.6rem}
.sidebar-header h2{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;font-size:.92rem;border-left:3px solid transparent}
.sidebar-nav .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-nav .nav-item.active{background:rgba(8,145,178,.3);color:#fff;border-left-color:var(--primary)}
.sidebar-nav .nav-item .nav-icon{font-size:1.15rem;width:22px;text-align:center}
.sidebar-nav .nav-section{padding:8px 20px 4px;font-size:.72rem;text-transform:uppercase;color:rgba(255,255,255,.35);letter-spacing:.5px}
.sidebar-nav .nav-group{margin:1px 0}
.sidebar-nav .nav-group-header{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.7);cursor:pointer;transition:all .2s;font-size:.92rem;border-left:3px solid transparent;user-select:none}
.sidebar-nav .nav-group-header:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar-nav .nav-group-header .nav-icon{font-size:1.15rem;width:22px;text-align:center}
.sidebar-nav .nav-group-header .chev{margin-left:auto;font-size:.7rem;transition:transform .25s;opacity:.7}
.sidebar-nav .nav-group.open .nav-group-header{color:#fff}
.sidebar-nav .nav-group.open .nav-group-header .chev{transform:rotate(90deg)}
.sidebar-nav .nav-group.has-active .nav-group-header{color:#fff;border-left-color:var(--primary)}
.sidebar-nav .nav-sub{max-height:0;overflow:hidden;transition:max-height .28s ease}
.sidebar-nav .nav-group.open .nav-sub{max-height:420px}
.sidebar-nav .nav-sub .nav-item{padding-left:54px;font-size:.88rem}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-footer .tag{font-size:.72rem;color:rgba(255,255,255,.55);text-align:center}
/* ===== Main ===== */
.main-content{margin-left:var(--sidebar-w);flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:50}
.topbar .menu-btn{display:none;font-size:1.4rem;cursor:pointer;background:none;border:none;color:var(--text)}
.topbar h1{font-size:1.15rem;font-weight:700}
.topbar .status-pill{margin-left:auto;font-size:.78rem;font-weight:600;padding:5px 14px;border-radius:16px;background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.content{padding:24px;flex:1}
.page{display:none;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ===== Cards / KPI ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
.kpi-grid.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.kpi-grid.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.kpi-grid.k4{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.kpi .label{font-size:.8rem;color:var(--text-secondary)}
.kpi .value{font-size:1.6rem;font-weight:800;margin-top:6px}
.kpi .unit{font-size:.85rem;color:var(--text-secondary);font-weight:600;margin-left:3px}
.kpi .note{font-size:.72rem;margin-top:5px;color:var(--text-secondary)}
.kpi.warn .value{color:var(--warn)}
.kpi.danger .value{color:var(--danger)}
.kpi.ok .value{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 14px rgba(15,23,42,.05);margin-bottom:20px;overflow:hidden}
.card-header{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-header h3{font-size:1rem;font-weight:700}
.card-header .badge{font-size:.72rem;padding:3px 10px;border-radius:12px;background:#ecfeff;color:var(--primary-dark);border:1px solid #a5f3fc;margin-left:auto}
.card-body{padding:20px}
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.chart-box h4{font-size:.92rem;margin-bottom:14px;color:var(--text)}
.chart-box .cv{position:relative;height:240px}
/* ===== Tables ===== */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--text-secondary);font-weight:600;font-size:.8rem}
td.l,th.l{text-align:left}
tr.subtotal{background:#f1f5f9;font-weight:700}
tr.total{background:#ecfeff;font-weight:800}
.tag-diff{display:inline-block;min-width:34px;padding:2px 8px;border-radius:10px;font-size:.78rem;font-weight:700}
.tag-diff.neg{background:#fee2e2;color:#b91c1c}
.tag-diff.pos{background:#dcfce7;color:#15803d}
.tag-diff.zero{background:#f1f5f9;color:#94a3b8}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.75rem;font-weight:700}
.tag.ok{background:#dcfce7;color:#15803d}.tag.warn{background:#fef3c7;color:#b45309}.tag.bad{background:#fee2e2;color:#b91c1c}.tag.info{background:#dbeafe;color:#1d4ed8}
.neg{color:#b91c1c}
.pos{color:#15803d}
/* ===== Info list ===== */
.info-list{display:flex;flex-direction:column;gap:0}
.info-item{padding:14px 0;border-bottom:1px dashed var(--border);display:grid;grid-template-columns:130px 1fr;gap:16px}
.info-item:last-child{border-bottom:none}
.info-item .k{font-weight:700;color:var(--primary-dark);font-size:.9rem}
.info-item .v{color:var(--text);line-height:1.75;font-size:.9rem}
.info-item .v p{margin:4px 0}
/* ===== Tabs ===== */
.tabs{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:20px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.tab{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:.88rem;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{background:#f1f5f9;color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(8,145,178,.28)}
.tab-count{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:9px;background:#f1f5f9;color:var(--text-secondary)}
.tab.active .tab-count{background:rgba(255,255,255,.22);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}
.veh-compare{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.veh-compare .tbl-scroll table{font-size:.84rem}
.veh-compare .tbl-scroll th,.veh-compare .tbl-scroll td{padding:9px 10px}
.subtabs{display:flex;width:fit-content;align-items:center;gap:6px;margin:0 0 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.subtab{border:none;background:transparent;color:var(--text-secondary);font-family:inherit;font-size:.84rem;font-weight:600;padding:8px 16px;border-radius:7px;cursor:pointer;transition:all .2s;white-space:nowrap}
.subtab:hover{background:#f1f5f9;color:var(--text)}
.subtab.active{background:#e0f2fe;color:var(--primary-dark);box-shadow:inset 0 0 0 1px #bae6fd}
.veh-subpanel{display:none}
.veh-subpanel.active{display:block}
.sub-h{font-size:.88rem;margin:10px 0}
@media(max-width:1000px){.veh-compare{grid-template-columns:1fr;gap:18px}}
@media(max-width:760px){.tabs{gap:6px;padding:5px}.tab{flex:1 0 auto;justify-content:center;padding:8px 10px;font-size:.82rem}.subtabs{width:100%;justify-content:space-between}.subtab{flex:1;text-align:center;padding:8px 4px}}
/* ===== Risk ===== */
.risk-item{border:1px solid var(--border);border-left-width:4px;border-radius:12px;padding:16px 18px;margin-bottom:14px;background:#fff}
.risk-item.mid{border-left-color:var(--warn)}
.risk-item.low{border-left-color:#94a3b8}
.risk-item.high{border-left-color:var(--danger)}
.risk-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.risk-level{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:10px}
.risk-level.mid{background:#fef3c7;color:#b45309}
.risk-level.low{background:#f1f5f9;color:#64748b}
.risk-level.high{background:#fee2e2;color:#b91c1c}
.risk-title{font-weight:700;font-size:.95rem}
.risk-desc{font-size:.86rem;color:var(--text-secondary);line-height:1.75}
.empty-state{padding:38px 20px;text-align:center;border:1px dashed var(--border);border-radius:14px;background:#fff;color:var(--text-secondary)}
.empty-state .es-title{font-weight:700;color:var(--text);font-size:.95rem;margin-bottom:6px}
.empty-state .es-sub{font-size:.84rem;line-height:1.7}
/* ===== Conclusion ===== */
.concl-box{background:linear-gradient(135deg,#ecfeff,#f0f9ff);border:1px solid #a5f3fc;border-radius:14px;padding:22px;margin-bottom:20px}
.concl-box .big{font-size:1.05rem;font-weight:700;color:var(--primary-dark);line-height:1.7}
.steps{counter-reset:s;margin-top:6px}
.step{position:relative;padding:12px 14px 12px 48px;border-bottom:1px dashed var(--border);font-size:.9rem;line-height:1.6}
.step:last-child{border-bottom:none}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700}
/* ===== Doc viewer ===== */
.doc-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.doc-toolbar .dt-name{font-weight:700;font-size:.95rem}
.doc-toolbar .dt-nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.doc-btn{border:1px solid var(--border);background:#f8fafc;color:var(--text);border-radius:8px;padding:7px 14px;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .2s}
.doc-btn:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary)}
.doc-btn:disabled{opacity:.4;cursor:not-allowed}
.doc-page-ind{font-size:.85rem;font-weight:600;min-width:70px;text-align:center}
.doc-dl{font-size:.82rem;color:#fff;background:var(--primary);border:1px solid var(--primary);padding:7px 14px;border-radius:8px;font-weight:600;text-decoration:none}
.pdf-single{background:#475569;border-radius:12px;padding:18px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;max-height:78vh}
.pdf-single img{flex:none;max-width:100%;height:auto;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);background:#fff}
.doc-meta{font-size:.82rem;color:var(--text-secondary);margin-bottom:14px;line-height:1.6}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .topbar .menu-btn{display:block}
  .info-item{grid-template-columns:1fr;gap:4px}
}

/* ===== 上会资料（参照京良路文档布局） ===== */
.doc-toolbar .dt-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.doc-btn{text-decoration:none}
.doc-section{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.doc-section h3{font-size:1rem;color:var(--primary-dark);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.doc-section h4{font-size:.92rem;margin:14px 0 8px;color:var(--text)}
.doc-section table{min-width:640px}
.doc-section p{font-size:.88rem;line-height:1.85;color:var(--text-secondary);margin:8px 0}
.doc-section ul{margin:6px 0 6px 20px;font-size:.88rem;line-height:1.85;color:var(--text-secondary)}
.doc-note{background:#f8fafc;border-left:3px solid var(--primary);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.84rem;line-height:1.7;color:var(--text-secondary);margin:10px 0}
.doc-note.warn{background:#fffbeb;border-left-color:var(--warn)}
.sheet-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.sheet-item{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#f8fafc}
.sheet-item .sn{flex:none;width:28px;height:28px;border-radius:8px;background:#ecfeff;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:800}
.sheet-item b{font-size:.86rem;line-height:1.5}
.sheet-item .sd{display:block;font-size:.78rem;color:var(--text-secondary);line-height:1.6;margin-top:2px}
.reply-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.reply{border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:.84rem;line-height:1.75;color:var(--text-secondary);background:#fff}
.reply b{display:block;color:var(--text);margin-bottom:4px;font-size:.82rem}
.reply.invest{border-left:3px solid #3b82f6;background:#f8fbff}
.reply.op{border-left:3px solid #f59e0b;background:#fffdf5}
@media(max-width:900px){.reply-grid{grid-template-columns:1fr}}
/* ===== 数据看板 / 财务 / 人车 新增组件 ===== */
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}}
.cash-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:stretch}
.cash-layout .kpi-grid{margin:0;height:100%;grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr));gap:12px}
.cash-layout .kpi{padding:14px 18px;display:flex;flex-direction:column;justify-content:center}
@media(max-width:980px){.cash-layout{grid-template-columns:1fr}.cash-layout .kpi-grid{height:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}}
@media(max-width:560px){.cash-layout .kpi-grid{grid-template-columns:1fr}}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-scroll table{min-width:720px}
.tbl-scroll.narrow table{min-width:520px}
.tbl-scroll table th:first-child,.tbl-scroll table td:first-child{white-space:nowrap}
.tbl-scroll.narrow table th{white-space:nowrap}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th.c,td.c{text-align:center}
.sec-note{font-size:.8rem;color:var(--text-secondary);line-height:1.75;margin-top:10px}
.pill{display:inline-block;font-size:.64rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px;white-space:nowrap}
.pill.warn{background:#fef3c7;color:#b45309}
.pill.bad{background:#fee2e2;color:#b91c1c}
.pill.ok{background:#dcfce7;color:#15803d}
.bench{margin-top:26px}
.bench:first-child{margin-top:4px}
.bench .bt{font-size:.8rem;color:var(--text-secondary);margin-bottom:17px;font-weight:600}
.bench .bar{position:relative;height:24px;background:#eef2f7;border-radius:7px}
.bench .fill{height:100%;border-radius:7px;position:relative;min-width:2px}
.bench .cap{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:800;color:#fff;white-space:nowrap;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bench .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:#334155;z-index:2}
.bench .mk span{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:.64rem;font-weight:700;color:#334155;white-space:nowrap}
.bench-scale{display:flex;justify-content:space-between;font-size:.64rem;color:#94a3b8;margin-top:5px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:9px 12px;font-size:.85rem;line-height:1.75}
.kv dt{font-weight:700;color:var(--primary-dark)}
.kv dd{color:var(--text-secondary)}
.cv{position:relative}
.cv.mid{height:280px}
.cv.tall{height:300px}
.cv.xl{height:380px}
@media print{.sidebar,.sidebar-overlay,.topbar,.doc-toolbar{display:none!important}.main-content{margin:0!important}.content{padding:0!important}.doc-section{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="app-layout active" id="appLayout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><span class="logo-icon">&#127961;</span><h2>湖州仁皇·城市大管家</h2></div>
    <nav class="sidebar-nav">
      <div class="nav-section">主菜单</div>
      <div class="nav-item active" onclick="navigateTo('dashboard',this)"><span class="nav-icon">&#128202;</span> 数据看板</div>
      <div class="nav-item" onclick="navigateTo('finance',this)"><span class="nav-icon">&#128176;</span> 财务分析</div>
      <div class="nav-item" onclick="navigateTo('staff',this)"><span class="nav-icon">&#128101;</span> 人车配置</div>
      <div class="nav-item" onclick="navigateTo('risks',this)"><span class="nav-icon">&#9888;&#65039;</span> 风险预警</div>
      <div class="nav-item" onclick="navigateTo('conclusion',this)"><span class="nav-icon">&#9989;</span> 评审结论</div>
      <div class="nav-item" id="navReview" onclick="navigateTo('background',this)"><span class="nav-icon">&#128194;</span> 评审信息</div>
      <div class="nav-item" id="navDoc" onclick="navigateTo('doc1',this)"><span class="nav-icon">&#128203;</span> 上会资料</div>
    </nav>
    <div class="sidebar-footer"><div class="tag">北控城市环境服务集团 · 内部评审</div></div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <h1 id="pageTitle">数据看板</h1>
      <span class="status-pill">已中标 · 实际开标 2026-10-27</span>
    </div>
    <div class="content">
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-finance"></div>
      <div class="page" id="page-staff"></div>
      <div class="page" id="page-risks"></div>
      <div class="page" id="page-conclusion"></div>
      <div class="page" id="page-background"></div>
      <div class="page" id="page-base"></div>
      <div class="page" id="page-invest"></div>
      <div class="page" id="page-ops"></div>
      <div class="page" id="page-doc1"></div>
      <div class="page" id="page-doc2"></div>
      <div class="page" id="page-doc3"></div>
    </div>
  </div>
</div>

<script>
/* ============ 数据（源自 投资评审报告 + 运营评审意见） ============ */
const FIN = {

const DOC={name:'湖州仁皇片区市政园林环卫一体化管养（大管家）项目运营评审意见',file:'files/opinion.bin',dl:'湖州仁皇片区市政园林环卫一体化管养（大管家）项目运营评审意见.pdf',meta:'城服运营中心 · 2026-10-24 · 新增项目 · 环卫 3 年 / 绿化、市政 2.5 年'};
function renderDoc(){
  $('page-doc1').innerHTML = docTabs('doc1') + `
  <div class="doc-toolbar"><span class="dt-name">${DOC.name}</span><div class="dt-actions"><button class="doc-btn" onclick="window.print()">打印 / 导出 PDF</button><a class="doc-dl" href="${DOC.file}" download="${DOC.dl}">下载 PDF 原文</a></div></div>
  <div class="doc-meta">${DOC.meta} · 以下为评审意见与投资回复、运营答复的逐项整理。</div>

  <div class="doc-section"><h3>一、运营风险汇总</h3>
    <h4>1. 利润率偏低</h4>
    <p>调整后平均净利润率 6.04%，低于集团一般要求 8%，仅略高于低效项目 6% 下限；最低（第三年）净利润率 5.59%，已跌破 6%。在服务费按最高限价下浮、人工与合规成本刚性上升的情况下，存在实际净利率继续下探及被上级单位考核处罚的风险。</p>
    <h4>2. 人员数量不足且用工方式不合规</h4>
    <p>招标文件明确人员基准配备数为 284—312 人，284 人为项目完全接管后的最低配置要求，且履约期内不得采用劳务外包。测算在册 156 人（管理 8、环卫 92、绿化 55、道桥 1），另拟绿化劳务外包 66 人，实际投入 222 人，较下限少 62 人、较上限少 90 人；即使在册人员全部到位，也较下限少 128 人。人员到位率要求不低于 90%（即不低于 256 人），现 222 人仅约 78.2%，不满足招标要求。若将 66 名外包人员转为自有员工，人工成本将上升，进一步压缩利润。</p>
    <h4>3. 保洁员人均作业面积偏大</h4>
    <p>招标保洁员服务费按 85 人核定，并允许在 72—98 人区间内按作业质量增减，服务费不随人数浮动。测算配置保洁员 62 人、单班作业；按实际道路作业面积 593,638.67㎡计算，人均约 9,574.85㎡/人·班，按 72 人约 8,244.98㎡、按 85 人约 6,983.98㎡，均低于行业一般 10,000㎡/人·班标准，且一至三级道路应双班作业，现全部按单班配置，作业质量与考核扣款风险较大。此前按道路总面积 1,780,916㎡计算的 28,724.45㎡/人系分母口径错误，已按实际作业面积更正。</p>
    <h4>4. 垃圾物流模式不合理</h4>
    <p>招标垃圾清运单价 137.28 元/吨·天、暂估约 79 吨/天，测算日清运量 76.5 吨。15 吨、18 吨压缩车无法对接中小型转运站（大型站可卸料但经济性差），适宜直运末端；测算单次往返 30 公里与至 12 公里外转运站的里程不符。2 辆新能源沿街垃圾车每日 180 公里、15 吨厨余车每日 160 公里，均超出城市道路频繁装卸条件下一般不超过 100 公里/日的合理水平；新能源车能耗按油费计列亦不合理。</p>
    <h4>5. 市政整体外包与分包合规风险</h4>
    <p>招标仅允许非主体、非关键性工作分包，且须经采购人书面同意；主体部分不得分包，履约期内不得劳务外包。测算将市政道路和桥梁日常维护整体外包、由平台公司收取管理费，并将绿化 66 名养护工按劳务外包配置，均与招标约束存在冲突。若不能在投标文件中说明并为采购人接受，存在响应无效、终止合同及退场风险。</p>

  <div class="doc-section"><h3>五、考核标准</h3>
    <p>本轮年化服务费至少减少 647.4 万元，服务标准应相应下调。投资回复：范围及内容无其他变化，考核标准降低；环卫人车配置数量低于现作业企业，绿化全部调整为二级管养标准。</p>
    <p>环卫按月度、季度、年度百分制考核，月度得分 88 分以下扣减当月服务费；年度结算时按约定服务费的 5% 结合考核结果核减，并按 1.5%—3% 结合年终考核排名核减，另有 7% 与上一年代付代缴费用清算挂钩。连续 2 个月或累计 3 个月月度不合格，年度直接不合格；年度不合格或同年度 2 次、累计 3 个月月度不合格，扣罚款并解除合同。绿化按月考核，80—89 分每低 1 分扣 2,000 元、70—79 分每低 1 分扣 3,000 元、低于 70 分扣 5 万元，连续两月低于 70 分或一年累计 4 个月不合格解除合同。市政 90 分合格，连续 2 次或累计 3 次不合格，或年度累计扣款超 10 万元终止合同。上述分值及扣款标准来自评审所附考核办法，招标文件正文明确按采购人现行考核办法执行，签约前应取得最新版本并逐条核对。</p>

  <div class="doc-section"><h3>七、车辆设备配置</h3>
    <h4>1. 环卫业务</h4>
    <p>招标要求环卫车辆 17 部、设备 36 部（合 53 部）。测算车辆 17 部，与招标数量一致：15 吨水车 3、15 吨机扫车 3、3 吨道路养护车 2、15/18 吨压缩车 5、15 吨自卸车 1、2 吨新能源沿街收集车 2、2.4 吨皮卡 1；设备 76 部，较招标多 40 部，主要为三轮电瓶快保车等小型设备。车辆数量虽已配齐，但租赁清单中的 8 吨洗扫车、洒水车低于招标“单车总质量≥15 吨”的规格要求，不能替代 15 吨级车辆；招标还要求车辆 2021-01-01 后首次登记、租赁协议覆盖服务期且出租方与所有权方一致，须逐车核验行驶证、登记证及租赁协议。</p>
    <h4>2. 绿化业务</h4>
    <p>招标绿化车辆及设备合计 99 部，其中车辆 12 部、设备 87 台；测算 92 部，少 7 部，全部为机动车（洒水车 -1、登高车 -1、运输车 -3、巡查车 -2）。绿化按 4.07 元/㎡·年固定单价、约 170 万㎡暂估面积报价，面积按实结算、单价不调整；投资回复因预算压缩、绿化全部按二级标准管护，绿化与环卫洒水车共用，并同意增配绿篱修剪车 1 台。共用洒水车须同时满足环卫与绿化作业时段，实际可调度性需在投标前验证。</p>
    <h4>3. 市政业务</h4>
    <p>招标要求市政车辆及机械设备不少于 13 部（台），包括铣刨机、摊铺机、压路机、沥青保温运输车、工程抢修车等；测算按业务整体外包，未配置任何车辆设备，缺口 13 部。招标仅允许非主体、非关键性工作分包且须经采购人书面同意，市政道路桥梁日常维护整体外包的合规性存疑；如改为自营，须补齐 13 部设备及相应人员。</p>
    <h4>4. 车辆接收及通行</h4>
    <p>投资回复：无车辆接收；新购车辆计提完折旧；通行条件无异常。招标未要求接收原作业企业车辆，但要求中标后实际投入车辆更换须经采购人书面同意，且不得低于投标响应条件；租赁车辆须提供租赁协议、首期租金发票、行驶证及购车发票，租赁期限应满足项目服务期。</p>
  </div>

  <div class="doc-section"><h3>八、环卫业务</h3>
    <h4>1. 道路清扫保洁</h4>
    <p>招标道路总面积 1,780,916㎡，测算实际作业面积 593,638.67㎡、占比约 33.33%，配置保洁员 62 人、单班作业，人均约 9,574.85㎡/人·班；按招标下限 72 人约 8,244.98㎡、按服务费核定 85 人约 6,983.98㎡。按浙江省及湖州市定额，一级道路 3,500—4,500㎡/人（20h 保洁）、二级 6,000—8,000㎡/人（18h）、三级 8,000—12,000㎡/人（16h）、四级 12,000—20,000㎡/人（城郊乡镇）；一至三级道路应双班作业，现全部单班，作业强度偏大。招标保洁员服务费按 85 人核定、可在 72—98 人区间调整且服务费不随人数浮动，压缩至 62 人虽不增加收入，但会放大考核扣款风险。</p>
    <h4>2. 人机协同及机械作业</h4>
    <p>招标设备配置要求三轮电瓶快保车 30 辆。测算配置人力保洁车 30 辆、电动保洁车 15 辆；投资回复调整为电动快保车 29 辆、人力快保车 31 辆，电动快保车较招标少 1 辆、人力快保车多 31 辆，结构与招标要求不一致。机械作业按作业里程/作业能力计算车辆需求，租赁清单 24 辆（含 1 辆皮卡）与驾驶员配置需逐车对应，避免有车无司机或有司机无车；投资回复称已调整驾驶员人数。</p>
    <h4>3. 无人驾驶</h4>
    <p>测算投入 2 辆无人驾驶清扫车（招标仅要求无人清扫设备 1 台），均未配置安全员；按《湖州市智能网联车辆产业创新发展条例》须配随车或远程安全员，建议按 1:3—1:5 配置并与主管部门确认；新购小型无人清洁机器人建议每 5—10 台配 1 名管理员。EDR、云控平台、智慧城管接入、网络安全等通讯成本未计，维修费未计 2 辆无人车，8 吨洗扫车每日约 300 公斤扫街污泥未计处置成本。投资回复：已增加流量费、维修费；污泥倾倒至甲方指定场所，无其他费用。</p>
    <h4>4. 垃圾清运</h4>
    <p>招标垃圾清运单价 137.28 元/吨·天、暂估约 79 吨/天，测算日清运量 76.5 吨。15 吨、18 吨压缩车不适用于中小型转运站倾倒，应直运末端；2 辆新能源沿街垃圾车每日 180 公里、18 吨压缩车 120 公里、15 吨压缩车 90 公里、15 吨厨余车 160 公里，均超出合理里程。新能源车能耗按油费计算不合理，应改为电费；车险及 GPS 测算 9 辆，多算原有车辆 3 辆；垃圾处置费、过路过桥费均回复不发生，须在合同中明确处置场所、计量方式及费用承担。</p>
    <h4>5. 除雪及应急</h4>
    <p>测算按 2 场雪（1 场小雪、1 场中雪），缺少大雪；仁皇片区 2022 年曾出现大雪，近 5 年有 5 次降雪过程。招标要求至少 1 套推雪板和 1 台撒布机（布撒宽度 3.5m 以上）或其他同等功能除雪设备。投资回复：湖州降雪较少，每年投入约 19 万元保障冬季除雪。运营建议补充大雪场次，增加“暴雪及连续大雪应急结算条款”，明确超标准作业补偿机制。</p>

function navigateTo(page, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('page-'+page).classList.add('active');
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav .nav-group').forEach(g=>g.classList.remove('has-active'));
  if(el){ el.classList.add('active'); var g=el.closest('.nav-group'); if(g){g.classList.add('open');g.classList.add('has-active');} }
  else if(['background','base','invest','ops'].indexOf(page)>=0){ var rv=$('navReview'); if(rv) rv.classList.add('active'); }
  else if(['doc1','doc2','doc3'].indexOf(page)>=0){ var nd=$('navDoc'); if(nd) nd.classList.add('active'); }
  $('pageTitle').textContent={dashboard:'数据看板',finance:'财务分析',staff:'人车配置',risks:'风险预警',conclusion:'评审结论',background:'评审信息 · 背景信息',base:'评审信息 · 基础信息',invest:'评审信息 · 投资信息',ops:'评审信息 · 运营信息',doc1:'上会资料 · 运营评审意见',doc2:'上会资料 · 投资测算表',doc3:'上会资料 · 招标文件'}[page]||page;
  $('sidebar').classList.remove('open');$('sidebarOverlay').classList.remove('open');
  try{ window.scrollTo(0,0); }catch(e){}
  if(page==='dashboard') setTimeout(()=>dashCharts(),40);
  if(page==='finance') setTimeout(()=>finCharts(),40);
  if(page==='staff') setTimeout(()=>staffCharts(),40);
}
function toggleGroup(h){h.parentElement.classList.toggle('open');}
function toggleSidebar(){$('sidebar').classList.toggle('open');$('sidebarOverlay').classList.toggle('open');}

/* ============ 图表 ============ */
const GRID={color:'#eef2f7'};
function bar(id,labels,data,colors,unit){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.parsed.y)+' '+(unit||'')}}},
      scales:{y:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+(unit||'')},title:{display:!!unit,text:'单位：'+(unit||'').trim()}},
        x:{grid:{display:false}}}}});
}
function doughnut(id,labels,data,colors,unit){
  const el=$(id); if(!el||el._done)return; el._done=true;
  const total=data.reduce((a,b)=>a+b,0);
  new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11},generateLabels:ch=>ch.data.labels.map((l,i)=>({text:l+' '+money(ch.data.datasets[0].data[i])+(unit?' '+unit:''),fillStyle:ch.data.datasets[0].backgroundColor[i],strokeStyle:ch.data.datasets[0].backgroundColor[i],lineWidth:0,index:i,hidden:false}))}},tooltip:{callbacks:{label:c=>' '+c.label+': '+money(c.parsed)+' 万元（'+(total?c.parsed/total*100:0).toFixed(1)+'%）'}}}}});
}
function hbar(id,labels,data,colors,unit){
  const el=$(id); if(!el||el._done)return; el._done=true;
  const total=data.reduce((a,b)=>a+b,0);
  new Chart(el,{type:'bar',data:{labels,datasets:[{data,backgroundColor:colors,borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.parsed.x)+' '+(unit||'')+'（'+(total?c.parsed.x/total*100:0).toFixed(1)+'%）'}}},
      scales:{x:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+(unit||'')},title:{display:true,text:'金额（'+(unit||'').trim()+'/年）'}},
        y:{grid:{display:false},ticks:{font:{size:11}}}}}});
}
function yearsChart(id){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{data:{labels:YEARS.labels,datasets:[
    {type:'bar',label:'业务收入（不含税）',data:YEARS.rev,backgroundColor:'#0891b2',borderRadius:6,yAxisID:'y'},
    {type:'bar',label:'主营业务成本',data:YEARS.cost,backgroundColor:'#cbd5e1',borderRadius:6,yAxisID:'y'},
    {type:'bar',label:'净利润',data:YEARS.net,backgroundColor:'#14b8a6',borderRadius:6,yAxisID:'y'},
    {type:'line',label:'净利润率（右轴）',data:YEARS.margin,borderColor:'#dc2626',backgroundColor:'#dc2626',tension:.25,pointRadius:4,borderWidth:2.5,yAxisID:'y1'},
    {type:'line',label:'集团要求 8%',data:[8,8,8],borderColor:'#f59e0b',borderDash:[6,4],pointRadius:0,borderWidth:2,yAxisID:'y1'},
    {type:'line',label:'低效底线 6%',data:[6,6,6],borderColor:'#64748b',borderDash:[4,4],pointRadius:0,borderWidth:2,yAxisID:'y1'}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},
      tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+money(c.parsed.y)+(c.dataset.yAxisID==='y1'?' %':' 万元')}}},
    scales:{y:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+' 万元'},title:{display:true,text:'金额（万元）'}},
      y1:{position:'right',min:0,max:10,grid:{display:false},ticks:{callback:v=>v+' %'},title:{display:true,text:'净利润率（%）'}},
      x:{grid:{display:false}}}}});
}
function cashChart(id){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{data:{labels:CASH.labels,datasets:[
    {type:'bar',label:'所得税后净现金流',data:CASH.net,backgroundColor:CASH.net.map(v=>v<0?'#dc2626':'#0891b2'),borderRadius:6,yAxisID:'y'},
    {type:'line',label:'累计净现金流',data:CASH.cum,borderColor:'#f59e0b',backgroundColor:'#f59e0b',tension:.2,pointRadius:4,borderWidth:2.5,yAxisID:'y'}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+money(c.parsed.y)+' 万元'}}},
    scales:{y:{grid:GRID,ticks:{callback:v=>v+' 万元'},title:{display:true,text:'金额（万元）'}},x:{grid:{display:false}}}}});
}
function staffChart(id){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{type:'bar',data:{labels:['管理人员','环卫作业','绿化维养','道桥维养','合计'],datasets:[
    {label:'招标下限',data:[9,95,179,1,284],backgroundColor:'#94a3b8',borderRadius:5},
    {label:'招标上限',data:[11,121,179,1,312],backgroundColor:'#cbd5e1',borderRadius:5},
    {label:'在册测算',data:[8,92,55,1,156],backgroundColor:'#0891b2',borderRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+' 人'}}},
    scales:{y:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+' 人'},title:{display:true,text:'人数（人）'}},x:{grid:{display:false}}}}});
}
function areaChart(id){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{type:'bar',data:{labels:AREA.map(x=>x.k),datasets:[{data:AREA.map(x=>x.v),backgroundColor:AREA.map(x=>x.c),borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.parsed.x)+' ㎡/人·班'}}},
      scales:{x:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+' ㎡'},title:{display:true,text:'人均覆盖面积（㎡/人·班）'}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
}
function vehChart(id){
  const el=$(id); if(!el||el._done)return; el._done=true;
  new Chart(el,{type:'bar',data:{labels:VEH_SUMMARY.map(x=>x.k),datasets:[
    {label:'招标',data:VEH_SUMMARY.map(x=>x.a),backgroundColor:'#94a3b8',borderRadius:5},
    {label:'测算',data:VEH_SUMMARY.map(x=>x.c),backgroundColor:'#0891b2',borderRadius:5}
  ]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+' 部'}}},
    scales:{y:{beginAtZero:true,grid:GRID,ticks:{callback:v=>v+' 部'},title:{display:true,text:'数量（部）'}},x:{grid:{display:false}}}}});
}
function dashCharts(){
  bar('chMargin',['平均净利润率','最低(第三年)','集团要求','低效线'],[6.04,5.59,8,6],['#0891b2','#dc2626','#94a3b8','#d97706'],'%');
  doughnut('chInvest',INVEST_BREAK.map(x=>x.k),INVEST_BREAK.map(x=>x.v),['#0891b2','#4f6ef7','#14b8a6','#f59e0b']);
  bar('chSvc',SVC_BREAK.map(x=>x.k+'('+x.term+')'),SVC_BREAK.map(x=>x.v),['#0891b2','#14b8a6','#4f6ef7'],'万元');
  bar('chRound',['上一轮','本轮'],[ROUND.prev,ROUND.cur],['#94a3b8','#0891b2'],'万元');
}
function finCharts(){
  var page=$('page-finance');
  if(!page) return;
  var active=page.querySelector('.tab-panel.active');
  if(!active) return;
  if(active.id==='finPanel-years'){
    yearsChart('chYears2');
  }else if(active.id==='finPanel-cost'){
    doughnut('chCostSeg',SEG_COST.map(x=>x.k),SEG_COST.map(x=>x.v),SEG_COST.map(x=>x.c));
    hbar('chCostItems',COST_ITEMS.map(x=>x.k),COST_ITEMS.map(x=>x.v),COST_ITEMS.map((x,i)=>i<2?'#dc2626':(i<4?'#f59e0b':'#0891b2')),'万元');
  }else if(active.id==='finPanel-cash'){
    cashChart('chCash');
  }
}
function staffCharts(){
  var people=$('staffPanel-people'), vehicle=$('staffPanel-vehicle');
  if(people&&people.classList.contains('active')){ staffChart('chStaff'); areaChart('chArea'); }
  if(vehicle&&vehicle.classList.contains('active')){ vehChart('chVeh'); }
}
